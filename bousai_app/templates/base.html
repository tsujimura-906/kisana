<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fa;
      color: #333;
    }

    /* ヘッダースタイル */
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    /* ナビゲーション */
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      transition: all 0.3s ease;
      font-size: 14px;
      font-weight: 500;
    }

    nav a:hover {
      background-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    nav span {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
    }

    /* メインコンテンツ */
    main {
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <!-- ヘッダー -->
  <header>
    <h1>🚨 防災アプリ</h1>
    
    <!-- ナビゲーション -->
    <nav>
      <a href="/">🏠 ホーム</a>
      <a href="/shelter_search">🏘️ 避難所検索</a>
      <a href="/shelter_register">📝 避難所登録</a>
      <a href="/board">📢 指示・発信ボード</a>
      <span>｜</span>
      {% if session.logged_in %}
        <span>👤 ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</span>
        <a href="/logout">🚪 ログアウト</a>
      {% else %}
        <span>👤 未ログイン</span>
        <a href="/login">🔐 ログイン</a>
      {% endif %}
    </nav>
  </header>

  <main>
    <!-- ここに子テンプレートの content が入る -->
    {% block content %}{% endblock %}
  </main>
</body>
</html>
