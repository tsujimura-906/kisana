{% extends "base.html" %}

{% block content %}
<div class="register-container">
  <h2>📝 避難所登録</h2>
  <p>新しい避難所情報を登録します。必須項目を入力して登録してください。</p>

  <!-- 成功・エラーメッセージ表示 -->
  {% if success %}
    <div class="alert alert-success">
      ✅ {{ message }}
    </div>
  {% endif %}

  {% if error %}
    <div class="alert alert-error">
      ❌ {{ message }}
    </div>
  {% endif %}

  <form method="POST" action="/shelter_register" class="register-form">
    <div class="form-group">
      <label for="name">避難所名<span class="required">（必須）</span></label><br>
      <input type="text" id="name" name="name" placeholder="例: 〇〇小学校">
    </div>

    <div class="form-group">
      <label for="address">住所</label><br>
      <input type="text" id="address" name="address" placeholder="例: 青森市〇〇区〇〇">
    </div>

    <div class="form-group">
      <label for="phone">電話番号</label><br>
      <input type="tel" id="phone" name="phone" placeholder="例: 090-1234-5678">
    </div>

    <div class="form-group">
      <label for="capacity">収容可能人数</label><br>
      <input type="number" id="capacity" name="capacity" placeholder="例: 500" min="0">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">🚀 登録</button>
      <a href="/" class="btn btn-secondary">戻る</a>
    </div>
  </form>

  <style>
    .register-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .register-container h2 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .alert {
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-weight: 500;
    }

    .alert-success {
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }

    .alert-error {
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }

    .register-form {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    .required {
      color: #e74c3c;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 4px rgba(102, 126, 234, 0.3);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background-color: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background-color: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
    }

    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }

    .btn-secondary:hover {
      background-color: #5a6268;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(108, 117, 125, 0.3);
    }
  </style>
{% endblock %}
